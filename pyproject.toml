[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moomoo-swing"
version = "0.1.0"
description = "moomoo証券 OpenAPI を使った米国株スイング自動売買ボット"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7", "yfinance>=0.2.40"]

[project.optional-dependencies]
moomoo = ["moomoo-api>=9.0"]
dev = ["pytest>=7.0"]

[project.scripts]
swing = "swing.__main__:main"

[tool.setuptools.packages.find]
include = ["swing*", "scalper*"]

[tool.setuptools.package-data]
"scalper.gui" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
