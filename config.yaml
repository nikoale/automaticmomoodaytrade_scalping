# ===== 米国株スイング自動売買ボット 設定 =====
# すべての数値はここで管理する (コードにハードコードしない)

account:
  capital_jpy: 200000            # 運用資金 (円)
  fx_rate_jpy_per_usd: 150.0     # 今の為替が取れないときの値。バックテストは常にこの値 (過去の為替変動は考慮しない)
  # 口座から計算した為替がこの範囲の外なら使わず、上の設定値を使う (模擬口座は円とドルで同じ数字を返し
  # 為替が 1 になることがある → 20 万円を 20 万ドルと誤る。2026-10-09 に模擬口座で実際に起きた)
  fx_sane_range: [80.0, 250.0]
  # 今の為替: 口座 (実口座の換算レート) → Yahoo Finance の USD/JPY → 上の設定値 の順に使う。
  # Yahoo の値はこの時間より古くなったら使わない
  fx_max_age_hours: 24
  fx_cost_pct: 0.0               # 両替コスト (片道 %)。0 = 無料と仮定
  settlement_days: 1             # 受渡日数 (米国株 T+1)。売却代金はこの営業日数後から再利用できる
  # ボットが使う資金:
  #   account → 「capital_jpy」と「口座の総資産」の小さい方 (口座に多くあっても capital_jpy までしか使わない)
  #   config  → capital_jpy だけ (口座を見ない)
  # ※ バックテストは過去の検証なので常に capital_jpy を使う
  capital_source: account

fees:
  commission_pct: 0.132          # 片道 約定代金 × 0.132% (moomoo証券 ベーシックコース)
  commission_max_usd: 22.0       # 1 注文あたりの上限
  slippage_pct: 0.1              # 片道スリッページ (寄り付き成行なので厳しめ)

data:
  # 価格・決算日・監視リスト・画面の設定の置き場。プログラムのフォルダの外 (ホーム) に置くので、
  # 新しい版を ZIP でダウンロードし直しても、取得済みのデータ (初回は数十分かかる) が消えない
  dir: ~/moomoo-swing/data
  price_source: yahoo            # yahoo (yfinance) / stooq
  history_start: "2010-01-01"    # 取得開始日 (10 年以上)
  benchmark: SPY                 # 市場フィルター用の指数 ETF
  earnings_source: yahoo         # yahoo (yfinance) / moomoo (OpenD: get_earnings_calendar ※要確認)
  # 週次スクリーナーのデータ元:
  #   moomoo: OpenD の条件選股でサーバー側で絞り、候補だけ日足を取る (Yahoo 不要・取得枠をほとんど使わない)
  #   free  : Yahoo の日足で全銘柄を自分で計算 (バックテストと同じ方法)
  screener_source: moomoo

universe:
  # 普通株とみなす名前 (Nasdaq Trader の Security Name にこのどれかを含む)
  require_name_patterns: ["Common Stock", "Ordinary Share", "Common Shares", "Class A", "Class B", "Class C"]
  exclude_adr: true              # ADR (American Depositary) を除外
  # 名前にこれらを含む銘柄は除外 (SPAC・ワラント・ユニット・優先株など)
  exclude_name_patterns: ["Acquisition Corp", "Acquisition Co", "Acquisition Inc", "Acquisition Ltd",
                          "Acquisition Holdings", " SPAC", "Warrant", " Unit", " Units", " Right",
                          "Preferred", "Depositary", "Notes due", "Debentures", "% Notes", "Trust Units",
                          "Beneficial Interest", "Limited Partnership"]

screener:
  price_min: 10.0
  price_max: 100.0
  avg_volume_days: 20
  avg_volume_min: 500000         # 直近 20 日の平均出来高 (株)
  market_cap_min_usd: 300000000  # 時価総額 3 億ドル
  earnings_exclude_days: 15      # 次回決算が今後 N 営業日以内なら除外
  earnings_unknown_policy: exclude   # 決算日が取れない銘柄: exclude (除外・ログに要確認) / keep (残して要確認フラグ)
  sma_fast: 50
  sma_slow: 200
  momentum_days: 126             # 6 ヶ月 ≒ 126 営業日
  momentum_top_pct: 20           # 6 ヶ月上昇率が市場全体の上位 20%
  volume_ratio_short: 20         # 出来高の伸び = 20 日平均 / 100 日平均
  volume_ratio_long: 100
  top_n: 20                      # 監視リストの銘柄数
  index_sma: 200                 # 指数 (SPY) がこの移動平均を下回る週は監視リストを空にする
  breakout_days: 20              # 監視リストに添付する 20 日高値
  atr_days: 14

strategy:
  breakout_days: 20              # 終値が直近 20 日高値を上抜け
  breakout_volume_mult: 1.5      # その日の出来高が 20 日平均の 1.5 倍以上
  max_positions: 3
  reentry_cooldown_days: 5       # 手仕舞いから N 営業日は同じ銘柄に再エントリーしない
  atr_days: 14
  initial_stop_atr: 2.0          # 初期損切り = エントリー価格 − ATR × 2
  trail_trigger_atr: 2.0         # 含み益が ATR × 2 を超えたらトレーリング開始
  trail_sma: 20                  # トレーリング損切り = max(20 日移動平均, 建玉後の最高値 − ATR × 2)
  trail_atr: 2.0
  time_exit_days: 20             # 保有 20 営業日で
  time_exit_min_gain_atr: 1.0    #   含み益が ATR × 1 未満なら手仕舞い
  earnings_exit_days_before: 2   # 決算日の 2 営業日前に手仕舞い
  index_filter: true             # SPY < 200 日線の日は全手仕舞い & 新規停止
  # 寄り付きの買い方:
  #   null = 成行 (指示書どおり)
  #   数値 = 上限付きの指値。「前日終値 × (1 + N%)」までなら寄り付きで買い、それより高く始まったら見送る
  #          (大きな窓開けでの高値づかみを避ける代わりに、強く上がる銘柄を逃すことがある)
  entry_limit_gap_pct: null

risk:
  risk_per_trade_pct: 2.0        # 1 トレードのリスク額 = 口座資金の 2%
  max_position_pct: 40.0         # 1 銘柄の上限 = 資金の 40%
  weekly_loss_limit_pct: 6.0     # その週の損失が資金の 6% に達したら新規停止
  allow_fractional: false        # 1 株未満 (micro 米国株) は使わない ※要確認事項

backtest:
  start: "2012-01-01"            # 口座シミュレーション開始 (指標計算用に history_start から助走)
  end: null                      # null = データの最終日
  out_of_sample_years: 2         # 直近 2 年を検証外期間にする
  stress_periods:                # 下落局面の個別評価
    "2020年": ["2020-01-01", "2020-12-31"]
    "2022年": ["2022-01-01", "2022-12-31"]
  # 寄り付きの買い方の比較 (上の entry_limit_gap_pct を変えたときの成績)。null = 成行
  entry_gap_compare: [null, 1.0, 2.0, 3.0]
  market_cap_proxy: current_shares   # 過去の時価総額 = 現在の発行済株数 × その日の株価 (近似) / none = フィルター無効
  report_dir: ~/moomoo-swing/reports

moomoo_data:                     # data.screener_source = moomoo のときの設定 (※実機では要確認)
  page_size: 200                 # get_stock_filter の 1 ページの件数 (SDK の上限 200)
  filter_interval_sec: 3.5       # get_stock_filter の呼び出し間隔 (頻度制限対策。制限値は要確認)
  candidates: 40                 # サーバー側で残った銘柄のうち、日足を取って確かめ直す数 (出来高の伸び順)
  bars_calendar_days: 450        # 日足を取る期間 (200 日線 + 余裕)
  earnings_lookahead_days: 35    # 決算カレンダーを見る日数 (15 営業日 ≒ 3 週間を必ず含む)

moomoo:                          # フェーズ 3 以降で使用 (発注・日次データ)
  host: 127.0.0.1
  port: 11111
  security_firm: FUTUJP
  acc_id: 0                      # 0 = 米国株の取引権限がある最初の口座
  trd_env: SIMULATE              # SIMULATE のみ。REAL は allow_real: true と起動時の確認 (コマンドで入力) の二重ロック。画面からは REAL で発注できない
  allow_real: false

executor:                        # フェーズ 3: 発注・リスク管理 (※実機の模擬口座で要確認)
  state_dir: trade               # data.dir の下。建玉・注文・帳簿を state_SIMULATE.json に保存
  # 翌寄り付きの成行をいつ出すか:
  #   reserve = 引け後の処理 (朝) で予約する。予約を受け付けなければ、寄り付き後の処理で出す
  #   at_open = 寄り付き後の処理で出す
  order_timing: reserve
  stop_time_in_force: GTC        # 逆指値は取り消すまで有効 (GTC)。DAY にすると毎日入れ直しが要る
  fill_wait_sec: 300             # 寄り付き後の処理で約定を待つ最大秒数。過ぎたら取り消して停止
  poll_sec: 10
  on_stop_failure: flatten       # 逆指値を入れられない建玉: flatten = 成行で売って停止 / halt = 停止だけ
  max_orders_per_run: 12         # 1 回の処理でこれを超えて注文しようとしたら停止 (暴走防止)
  watchlist_max_age_days: 10     # これより古い監視リストでは新規エントリーしない
  earnings_refresh_days: 14      # 毎日、建玉の決算日を決算カレンダーで取り直す日数
  test_symbol: SPY               # 発注機能の確認 (模擬口座) に使う銘柄

schedule:                        # フェーズ 4: 自動実行 (すべて日本時間。夏時間・冬時間・米国の祝日は自動)
  daily_run: "07:30"             # 引け後の処理。米国の引け (夏 5:00 / 冬 6:00) の後
  open_run_delay_min: 3          # 寄り付き後の処理 = 寄り付き (夏 22:30 / 冬 23:30) の N 分後
  open_run_max_late_min: 60      # 寄り付きから N 分を過ぎたら、その日の寄り付き後の処理はしない (遅すぎる約定を避ける)
  weekly_screen_day: Saturday    # 週次スクリーナー
  weekly_screen_time: "09:00"
  retry_count: 3                 # OpenD に接続できないなどで失敗したら、retry_min 分ごとに N 回まで試す
  retry_min: 5
  tick_sec: 30                   # 予定を確かめる間隔 (秒)
  notify: true                   # Mac の通知 (発注停止・失敗のとき)

logging:
  dir: ~/moomoo-swing/logs
