# ===== 米国株 (通常取引 9:30〜16:00 ET) =====
# mode: paper (練習) / simulate (moomoo 模擬口座) / live (実口座。--confirm-live が必要)
mode: paper
symbols: [US.AAPL, US.NVDA]
bar_minutes: 5      # 足の長さ (1/3/5/15 分)。手数料 0.132% だと 1 分足は値幅が小さく手数料負けしやすい
moomoo:
  security_firm: FUTUJP     # moomoo証券(日本) の口座
  trd_market: US
session:
  timezone: America/New_York
  sessions: [["09:30", "16:00"]]
  no_entry_first_minutes: 5
  no_entry_last_minutes: 15
  flatten_before_close_minutes: 5
strategy:
  name: ema_vwap
  params: {fast: 9, slow: 21, volume_mult: 1.2}
exits:
  stop_atr: 1.0
  target_atr: 1.5
  breakeven_atr: 0.8
  max_hold_bars: 20
  min_atr_ticks: 3
risk:
  account_size: 10000         # USD
  risk_per_trade: 0.003
  max_position_value: 5000
  max_open_positions: 2
  lot_size: 1
  max_daily_loss: 100
  allow_short: false
execution:
  tick_size: auto
  slippage_ticks: 1
# 銘柄の自動選定: enabled: true で、起動時と稼働中に候補 (流動性の高い約 60 銘柄) から
# 「当日値幅 × 売買代金 × 出来高比率」の点数が高い順に count 銘柄を選んで symbols を置き換える
auto_symbols:
  enabled: true
  refresh_minutes: 30          # 稼働中も 30 分ごと＋寄り付きなど時間帯の切り替わりで選び直す (0 = 開始時のみ)
  count: 2
  min_price: 5
  max_price: 1000              # 1 ポジション上限 (5000 USD) で 5 株以上買える価格まで
  min_turnover: 100000000      # 当日売買代金 1 億ドル以上
  min_amplitude_pct: 1.5       # 当日値幅 1.5% 以上
  max_spread_pct: 0.05
  # universe: [US.NVDA, US.TSLA, US.AMD]   # 候補を自分で指定する場合
