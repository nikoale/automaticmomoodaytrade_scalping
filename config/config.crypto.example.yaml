# ===== 暗号資産 (24 時間) — paper モード専用 =====
# moomoo OpenAPI には暗号資産の模擬口座がないため、本ボットでは paper (相場のみ使用) / backtest のみ対応。
#
# ★ 銘柄コードは環境によって異なる可能性があるので、まず一覧で確認してください:
#     python -m scalper symbols -c config/config.crypto.yaml --market CC --grep BTC
#   表示されたコードを下の symbols に書きます。
mode: paper
symbols: [CC.BTCUSD]            # ← symbols コマンドで確認したコードに書き換える
bar_minutes: 1
moomoo:
  trd_market: CC
session:
  timezone: America/New_York    # moomoo の足の時刻 (time_key) に合わせる
  sessions: [["00:00", "00:00"]]   # 24 時間
  no_entry_first_minutes: 0
  no_entry_last_minutes: 0
  flatten_before_close_minutes: 1  # 1 日 1 回 (0 時) だけ区切りで決済
strategy:
  name: ema_vwap
  params: {fast: 9, slow: 21, volume_mult: 1.2}
exits:
  stop_atr: 1.2
  target_atr: 1.8
  breakeven_atr: 0.8
  max_hold_bars: 20
  # 暗号資産の「ティック」は価格の桁で決まる (1万〜10万ドル台なら 0.01、1000 ドル台なら 0.001)
  min_atr_ticks: 3000           # BTC 6 万ドルなら ATR 30 ドル (約 0.05%) 未満は値幅不足で見送り
risk:
  account_size: 10000           # USD
  risk_per_trade: 0.002         # 1 回 20 ドルまで
  max_position_value: 2000
  max_open_positions: 1
  lot_size: 0.0001              # 小数単位で数量計算
  max_daily_loss: 60
  max_trades_per_day: 40
execution:
  tick_size: auto
  slippage_ticks: 1000          # BTC 6 万ドルなら 10 ドル (約 0.017%)
  commission_rate: 0.0          # 実際の手数料率 (例: 0.001 = 0.1%) を入れると現実に近くなる
auto_symbols:                  # 候補は moomoo の暗号資産一覧 (USD 建て) から自動取得
  enabled: false
  count: 2
  min_turnover: 1000000
  min_amplitude_pct: 1.0
  max_spread_pct: 0.1
