# ===== 米国株・時間外取引 (プレ / アフター / オーバーナイト) 込み =====
# 時刻はすべて米国東部時間 (ET)。日本時間との差は夏時間 13 時間 / 冬時間 14 時間。
#   オーバーナイト 20:00〜翌04:00 ET = 日本時間 9:00〜17:00 (夏時間)
#   プレマーケット 04:00〜09:30 ET   = 日本時間 17:00〜22:30
#   通常取引       09:30〜16:00 ET   = 日本時間 22:30〜翌5:00
#   アフター       16:00〜20:00 ET   = 日本時間 翌5:00〜9:00
# ⚠ 時間外は出来高が少なく値が飛びやすい。スプレッドも広いので paper で十分確認を。
mode: paper
symbols: [US.NVDA, US.TSLA]   # 時間外でも出来高のある銘柄を推奨
bar_minutes: 1
moomoo:
  security_firm: FUTUJP
  trd_market: US
session:
  timezone: America/New_York
  us_session: ALL               # RTH / ETH(プレ+アフター) / ALL(+オーバーナイト) / OVERNIGHT
  day_rollover: "20:00"         # オーバーナイト開始で「1 日」が切り替わる (深夜 0 時で VWAP をリセットしない)
  sessions:
    - ["20:00", "04:00"]        # オーバーナイト (日付またぎ)
    - ["04:00", "09:30"]        # プレマーケット
    - ["09:30", "16:00"]        # 通常取引
    - ["16:00", "20:00"]        # アフターマーケット
  no_entry_first_minutes: 5
  no_entry_last_minutes: 10
  flatten_before_close_minutes: 3
  flatten_each_session: true    # 各時間帯の終わりで決済 (時間帯の切り替わりは値が飛びやすい)
strategy:
  name: ema_vwap
  params: {fast: 9, slow: 21, volume_mult: 1.5}
exits:
  stop_atr: 1.0
  target_atr: 1.5
  breakeven_atr: 0.8
  max_hold_bars: 15
  min_atr_ticks: 5              # 時間外はスプレッドが広いので値幅の小さい場面は見送り
risk:
  account_size: 10000
  risk_per_trade: 0.002
  max_position_value: 3000
  max_open_positions: 1
  lot_size: 1
  max_daily_loss: 60
  allow_short: false
execution:
  tick_size: auto
  slippage_ticks: 2
  limit_offset_ticks: 2
auto_symbols:
  enabled: true
  refresh_minutes: 30
  count: 2
  min_price: 5
  max_price: 1000
  min_turnover: 100000000
  min_amplitude_pct: 1.5
  max_spread_pct: 0.1          # 時間外はスプレッドが広め
